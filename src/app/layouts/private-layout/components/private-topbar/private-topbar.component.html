<header class="border-b border-theme-border bg-surface text-content shadow-sm">
  <div class="mx-auto flex min-h-16 w-full max-w-[1800px] items-center gap-3 px-4 sm:px-6 lg:px-8">
    <button type="button" class="grid size-11 place-items-center rounded-lg border border-theme-border bg-card lg:hidden" aria-label="Abrir o cerrar menú" aria-controls="private-sidebar" [attr.aria-expanded]="sidebarOpen()" (click)="toggleSidebar.emit()">
      <span aria-hidden="true">☰</span>
    </button>
    <a routerLink="/app/inicio" class="flex min-h-11 items-center gap-2 rounded-lg" aria-label="Ir al inicio privado de ORMAN">
      <img class="h-10 w-auto" src="/images/brand/orman-logo.svg" alt="ORMAN" />
      <span class="hidden text-sm font-bold tracking-[0.18em] sm:inline">ORMAN</span>
    </a>
    <div class="ml-auto flex items-center gap-2">
      <app-theme-selector />
      <span class="hidden max-w-40 truncate text-sm text-muted sm:inline">{{ loginName() }}</span>
      <button type="button" class="min-h-11 rounded-lg border border-accent px-3 text-sm font-semibold text-accent-text hover:bg-accent hover:text-accent-contrast disabled:opacity-60" [disabled]="isLoggingOut()" (click)="logout()">
        {{ isLoggingOut() ? 'Cerrando sesión…' : 'Cerrar sesión' }}
      </button>
    </div>
  </div>
  @if (logoutError()) { <p class="sr-only" role="alert">{{ logoutError() }}</p> }
</header>
