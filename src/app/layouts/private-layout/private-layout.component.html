<div class="flex h-[100dvh] flex-col overflow-hidden bg-page text-content">
  <ngx-sonner-toaster
    [theme]="notificationTheme()"
    position="bottom-right"
    [duration]="5000"
    [visibleToasts]="3"
    [richColors]="true"
    closeButton
    offset="1.5rem"
  />
  <app-private-topbar
    [hasSidebarNavigation]="hasSidebarNavigation()"
    [isSidebarOpen]="isSidebarOpen()"
    (sidebarRequested)="toggleSidebar()"
  />
  <div class="relative flex min-h-0 w-full flex-1 items-stretch overflow-hidden">
    @if (hasSidebarNavigation() && isSidebarOpen()) {
      <button
        type="button"
        class="private-sidebar-backdrop absolute inset-0 z-10 bg-overlay lg:hidden"
        aria-label="Cerrar menú lateral"
        (click)="closeSidebar()"
      ></button>
    }
    @if (hasSidebarNavigation()) {
      <app-private-sidebar [open]="isSidebarOpen()" (closed)="closeSidebar()" />
    }
    <main
      id="private-content"
      class="min-h-0 min-w-0 flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8"
      tabindex="-1"
    >
      <router-outlet />
    </main>
  </div>
</div>
