<div class="min-h-screen bg-page text-content">
  <app-private-topbar
    [sidebarOpen]="isSidebarOpen()"
    (toggleSidebar)="toggleSidebar()"
  />
  <div class="mx-auto flex w-full max-w-[1800px]">
    <app-private-sidebar [open]="isSidebarOpen()" (closed)="closeSidebar()" />
    <main id="private-content" class="min-w-0 flex-1 p-4 sm:p-6 lg:p-8" tabindex="-1">
      <router-outlet />
    </main>
  </div>
</div>
