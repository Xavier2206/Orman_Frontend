<div class="overlay">
  <section
    appPersonaModalFocus
    class="modal-panel"
    role="dialog"
    aria-modal="true"
    aria-labelledby="role-status-title"
    [attr.aria-describedby]="
      feedback() ? 'role-status-description role-status-error' : 'role-status-description'
    "
    [class.operation-deactivate]="operation() === 'deactivate'"
    [class.operation-activate]="operation() === 'activate'"
    [attr.aria-busy]="submitting()"
    (escapePressed)="close()"
  >
    <header class="modal-header">
      <div class="operation-icon" aria-hidden="true">
        <mat-icon>{{ operationIcon() }}</mat-icon>
      </div>
      <h2 id="role-status-title">{{ operationTitle() }}</h2>
    </header>

    <div class="modal-body">
      <p class="role-name">{{ roleName() }}</p>
      <p id="role-status-description" class="confirmation-message">{{ operationMessage() }}</p>
      @if (feedback(); as message) {
        <p id="role-status-error" class="status-error" role="alert">{{ message }}</p>
      }
    </div>

    <footer class="modal-footer">
      <button class="secondary-button" type="button" [disabled]="submitting()" (click)="close()">
        Cancelar
      </button>
      <button
        class="confirm-button"
        type="button"
        [disabled]="submitting()"
        (click)="confirmed.emit()"
      >
        <mat-icon aria-hidden="true">{{ operationIcon() }}</mat-icon>
        <span aria-live="polite">{{ submitting() ? submittingLabel() : actionLabel() }}</span>
      </button>
    </footer>
  </section>
</div>
