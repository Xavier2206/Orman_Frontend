<section aria-labelledby="private-home-title" class="mx-auto flex min-h-full max-w-4xl items-center">
  <div class="w-full rounded-xl border border-theme-border bg-card p-8 shadow-md sm:p-10">
    <p class="text-sm font-semibold uppercase tracking-[0.18em] text-accent-text">Área privada</p>
    <h1 id="private-home-title" class="mt-3 text-3xl font-bold text-content sm:text-4xl">Área privada ORMAN</h1>
    @if (roles().length === 0) {
      <p class="mt-4 text-lg text-muted">No tienes un rol asignado actualmente.</p>
    } @else if (selectedRole() && selectedRole()!.menus.length === 0) {
      <p class="mt-4 text-lg text-muted">No hay menús disponibles para este rol.</p>
    } @else {
      <p class="mt-4 text-lg text-muted">Contenido en construcción</p>
    }
  </div>
</section>
