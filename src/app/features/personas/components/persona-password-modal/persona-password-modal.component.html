<div class="overlay">
  <section
    appPersonaModalFocus
    class="modal-panel"
    role="dialog"
    aria-modal="true"
    aria-labelledby="persona-password-title"
    (escapePressed)="close()"
  >
    <header>
      <h2 id="persona-password-title">Cambiar contraseña</h2>
      <button type="button" aria-label="Cerrar" [disabled]="submitting()" (click)="close()">
        ×
      </button>
    </header>
    <p>Usuario: {{ login() }}</p>
    @if (feedback()) {
      <p class="feedback" role="alert">{{ feedback() }}</p>
    }
    <form [formGroup]="form" (ngSubmit)="submit()">
      <label
        >Nueva contraseña<input
          type="password"
          formControlName="password"
          minlength="8"
          maxlength="72" /></label
      ><label
        >Confirmar contraseña<input
          type="password"
          formControlName="confirmation"
          minlength="8"
          maxlength="72"
        /><small>{{ mismatch ? 'Las contraseñas no coinciden.' : '' }}</small></label
      >
      <footer>
        <button type="button" [disabled]="submitting()" (click)="close()">Cancelar</button
        ><button [disabled]="submitting()">Guardar</button>
      </footer>
    </form>
  </section>
</div>
