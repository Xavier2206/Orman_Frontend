<section
  id="inicio"
  class="scroll-mt-28 overflow-hidden py-16 sm:py-20 lg:py-24"
  aria-labelledby="hero-title"
>
  <div class="mx-auto grid max-w-[1800px] items-center gap-12 px-4 sm:px-6 lg:grid-cols-2 lg:px-8 xl:px-12 2xl:px-16">
    <div>
      <p
        class="inline-flex rounded-full border border-theme-border bg-surface px-4 py-2 text-sm font-semibold text-accent"
      >
        Propiedades familiares en alquiler
      </p>
      <h1
        id="hero-title"
        class="mt-6 max-w-3xl text-4xl font-bold tracking-tight text-content sm:text-5xl lg:text-6xl"
      >
        Encuentra el espacio ideal para ti
      </h1>
      <p class="mt-6 max-w-2xl text-lg leading-8 text-muted">
        Explora casas, departamentos, tiendas y otros espacios disponibles administrados
        directamente por ORMAN.
      </p>
      <div class="mt-8 flex flex-col gap-3 sm:flex-row">
        <a
          class="inline-flex min-h-12 items-center justify-center rounded-xl bg-accent px-6 py-3 font-semibold text-accent-contrast shadow-md transition-colors hover:bg-accent-hover motion-reduce:transition-none"
          href="#propiedades"
        >
          Ver espacios disponibles
        </a>
        <a
          class="inline-flex min-h-12 items-center justify-center rounded-xl border border-theme-border bg-card px-6 py-3 font-semibold text-content transition-colors hover:bg-card-hover motion-reduce:transition-none"
          href="#contacto"
        >
          Contactar
        </a>
      </div>
    </div>

    <div class="relative mx-auto w-full max-w-xl">
      <div
        class="relative isolate overflow-hidden rounded-3xl border border-[color:var(--theme-hero-border)] bg-[var(--theme-hero-panel)] px-6 py-8 shadow-lg sm:px-8 sm:py-10 lg:px-10 lg:py-12"
      >
        <div class="pointer-events-none absolute inset-0" aria-hidden="true">
          <span class="absolute left-1/2 top-[42%] size-40 -translate-x-1/2 -translate-y-1/2 rounded-full bg-[var(--theme-hero-glow)] blur-3xl sm:size-56"></span>
          <span class="hero-logo-line absolute left-5 top-5 h-16 w-16 rounded-tl-2xl border-l border-t border-[color:var(--theme-hero-decoration)] sm:left-8 sm:top-8 sm:h-24 sm:w-24"></span>
          <span class="hero-logo-line absolute bottom-5 right-5 h-16 w-16 rounded-br-2xl border-b border-r border-[color:var(--theme-hero-decoration)] sm:bottom-8 sm:right-8 sm:h-24 sm:w-24"></span>
          <span class="hero-logo-line absolute inset-x-0 top-1/3 border-t border-[color:var(--theme-hero-decoration)]"></span>
          <span class="hero-logo-line absolute bottom-0 left-1/2 h-24 w-px bg-[var(--theme-hero-decoration)] sm:h-32"></span>
          <span class="hero-logo-line absolute right-[18%] top-[18%] hidden size-3 rounded-full border border-[color:var(--theme-hero-decoration)] lg:block"></span>
        </div>

        <div class="hero-logo-entrance relative flex flex-col items-center text-center">
          <div class="hero-logo-surface flex items-center justify-center rounded-3xl border border-[color:var(--theme-hero-logo-border)] bg-[var(--theme-hero-logo-surface)] px-7 py-5 sm:px-9 sm:py-6">
            <img
              class="h-36 w-auto object-contain sm:h-48 lg:h-56"
              src="/images/brand/orman-logo.svg"
              alt="Logotipo oficial de ORMAN"
            />
          </div>
          <p class="mt-5 text-base font-semibold tracking-wide text-[var(--theme-hero-text)] sm:mt-6 sm:text-lg">
            Gestión familiar de propiedades
          </p>
          <div class="mt-3 flex flex-wrap justify-center gap-2 sm:mt-4" aria-label="Tipos de propiedades gestionadas">
            <span class="rounded-full border border-[color:var(--theme-hero-tag-border)] bg-[var(--theme-hero-tag)] px-3 py-1 text-xs font-medium text-[var(--theme-hero-text-muted)]">
              Casas y edificios
            </span>
            <span class="rounded-full border border-[color:var(--theme-hero-tag-border)] bg-[var(--theme-hero-tag)] px-3 py-1 text-xs font-medium text-[var(--theme-hero-text-muted)]">
              Departamentos y tiendas
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
