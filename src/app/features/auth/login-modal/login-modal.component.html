<div
  class="login-modal-overlay fixed inset-0 z-220 flex items-center justify-center overflow-y-auto bg-overlay p-4 backdrop-blur-sm sm:p-6"
  (click)="handleBackdropClick($event)"
>
  <section
    #dialogPanel
    class="login-modal-panel relative my-auto max-h-[calc(100dvh-2rem)] w-full max-w-lg overflow-y-auto px-6 pb-6 pt-5 text-content sm:px-8 sm:pb-8 sm:pt-7"
    role="dialog"
    aria-modal="true"
    aria-labelledby="login-modal-title"
    aria-describedby="login-modal-description"
  >
    <button
      type="button"
      class="absolute right-4 top-4 grid size-11 place-items-center rounded-lg border border-theme-border bg-card text-content transition-colors duration-200 hover:bg-card-hover focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus motion-reduce:transition-none"
      aria-label="Cerrar inicio de sesión"
      (click)="requestClose()"
    >
      <svg
        class="size-5"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        aria-hidden="true"
      >
        <path d="M6 6l12 12M18 6 6 18" />
      </svg>
    </button>

    <div class="login-modal-header">
      <img
        class="mx-auto h-14 w-auto object-contain"
        src="/images/brand/orman-logo.svg"
        alt="ORMAN"
      />

      <div class="mt-4 flex items-center gap-3" aria-label="Paso 2 de 2">
        <span
          class="grid size-8 place-items-center rounded-full border border-accent bg-surface text-sm font-bold text-content"
          >1</span
        >
        <span class="h-px flex-1 bg-accent" aria-hidden="true"></span>
        <span
          class="grid size-8 place-items-center rounded-full bg-accent text-sm font-bold text-accent-contrast"
          aria-current="step"
          >2</span
        >
      </div>

      <h2 id="login-modal-title" class="mt-4 text-2xl font-bold tracking-tight text-content">
        Iniciar sesión
      </h2>
      <p id="login-modal-description" class="mt-2 text-muted">Accede a tu cuenta ORMAN.</p>
    </div>

    <form class="mt-6 grid gap-5" [formGroup]="loginForm" (ngSubmit)="submitLogin()" novalidate>
      <div class="login-field relative">
        <input
          #usernameInput
          id="login-username"
          type="text"
          formControlName="username"
          autocomplete="username"
          class="login-field-input peer min-h-12 w-full border-field-border bg-field px-4 pb-2 pt-5 text-content placeholder:text-transparent"
          [class.field-error]="showUsernameError()"
          [class.field-valid]="isUsernameValid()"
          placeholder=" "
          [attr.aria-invalid]="showUsernameError()"
          [attr.aria-describedby]="showUsernameError() ? 'login-username-error' : null"
        />
        <label for="login-username" class="login-field-label">
          Usuario o correo
        </label>
        @if (showUsernameError()) {
          <p id="login-username-error" class="login-field-error mt-2 text-sm font-medium" role="alert">
            Ingresa tu usuario o correo.
          </p>
        }
      </div>

      <div class="login-field relative">
        <div class="relative">
          <input
            id="login-password"
            [type]="passwordVisible() ? 'text' : 'password'"
            formControlName="password"
            autocomplete="current-password"
            class="login-field-input peer min-h-12 w-full border-field-border bg-field px-4 pb-2 pt-5 pr-14 text-content placeholder:text-transparent"
            [class.field-error]="showPasswordError()"
            [class.field-valid]="isPasswordValid()"
            placeholder=" "
            [attr.aria-invalid]="showPasswordError()"
            [attr.aria-describedby]="showPasswordError() ? 'login-password-error' : null"
          />
          <label for="login-password" class="login-field-label">
            Contraseña
          </label>
          <button
            type="button"
            class="absolute right-1 top-1/2 grid size-11 -translate-y-1/2 place-items-center rounded-lg text-muted transition-colors duration-200 hover:bg-card-hover hover:text-content focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus motion-reduce:transition-none"
            [attr.aria-label]="passwordVisible() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            [attr.aria-pressed]="passwordVisible()"
            (click)="togglePasswordVisibility()"
          >
            @if (passwordVisible()) {
              <svg
                class="size-5"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                aria-hidden="true"
              >
                <path d="M3 3l18 18M10.6 10.7A2 2 0 0 0 13.3 13.4M9.9 4.3A10.7 10.7 0 0 1 12 4c5.5 0 9 5 9 5a15.8 15.8 0 0 1-2.1 2.6M6.2 6.2C4.1 7.5 3 9 3 9s3.5 5 9 5c1.1 0 2.1-.2 3-.5" />
              </svg>
            } @else {
              <svg
                class="size-5"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                aria-hidden="true"
              >
                <path d="M3 12s3.5-5 9-5 9 5 9 5-3.5 5-9 5-9-5-9-5Z" />
                <circle cx="12" cy="12" r="2.5" />
              </svg>
            }
          </button>
        </div>
        @if (showPasswordError()) {
          <p id="login-password-error" class="login-field-error mt-2 text-sm font-medium" role="alert">
            Ingresa tu contraseña.
          </p>
        }
      </div>

      @if (showInformation()) {
        <p
          class="rounded-xl border border-theme-border bg-surface p-4 text-sm leading-6 text-muted"
          role="status"
        >
          El acceso al sistema estará disponible próximamente.
        </p>
      }

      <div class="mt-1 flex flex-col-reverse gap-3 sm:flex-row sm:justify-end">
        <button
          type="button"
          class="login-modal-action login-modal-secondary inline-flex min-h-12 items-center justify-center px-5 py-3 font-semibold text-content transition-colors duration-200 hover:bg-card-hover focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus motion-reduce:transition-none"
          (click)="requestClose()"
        >
          Cancelar
        </button>
        <button
          type="submit"
          class="login-modal-action inline-flex min-h-12 items-center justify-center bg-accent px-5 py-3 font-semibold text-accent-contrast shadow-md transition-colors duration-200 hover:bg-accent-hover focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus motion-reduce:transition-none"
        >
          Iniciar sesión
        </button>
      </div>
    </form>
  </section>
</div>
